[package]
name = "str_extensions"
authors = ["orgrinrt", "Hiisi Digital"]
version = "0.0.2"
edition = "2021"
description = "Useful extension methods for strings in Rust, configurable by feature flags to minimise its footprint."
license = "MPL-2.0"
readme = "README.md"
keywords = ["string", "format", "case", "snake", "camel"]
categories = ["text-processing", "value-formatting", "development-tools", "gui", "localization"]
homepage = "https://github.com/orgrinrt/str_extensions"
repository = "https://github.com/orgrinrt/str_extensions"

# The lending example needs the feature the lending API is behind. Without this,
# `cargo build --examples` on the default selection fails on a feature nobody asked for.
[[example]]
name = "no_allocator_at_all"
required-features = ["no_alloc", "full_format"]

[dev-dependencies]

[dependencies]
# The branch, until the no_std work there is on main. The lending API and the public word
# sink both come from it.
word_bounds = { git = "https://github.com/orgrinrt/word_bounds.git", branch = "feat/no-std", default-features = false }
# Only under `no_alloc`, where it supplies the lending contract `write_case` is written
# against. notko is not on crates.io yet, so this is a git dependency, and a crate carrying
# `no_alloc` cannot be published until it is.
notko = { git = "ssh://git@github.com/orgrinrt/notko.git", branch = "dev", optional = true, default-features = false }

[features]
default = ["full_format", "full_building", "full_type_coercion", "use_regex"]
# options
use_fancy_regex = ["word_bounds/use_fancy_regex"]
use_regex = ["word_bounds/use_regex"]
optimize_for_memory = ["word_bounds/optimize_for_memory"]
optimize_for_cpu = ["word_bounds/optimize_for_cpu"]
# format/case
full_format = ["to_snake_case", "to_camel_case", "to_pascal_case", "to_kebab_case", "to_human_readable", "to_title_case"]
to_snake_case = []
to_camel_case = []
to_pascal_case = []
to_kebab_case = []
to_human_readable = []
to_title_case = []
# building
# `join` used to gate a method that did what `append` does. It gates the separator form
# now, which is what the name means on a slice. `concat` had no flag of its own and now has
# one, and each of the three genuinely selects its method rather than only deciding whether
# the module exists.
full_building = ["append", "prepend", "concat", "join"]
append = []
prepend = []
concat = []
join = []
# type coercion
full_type_coercion = ["as_cow", "into_arc", "to_arc"]
as_cow = []
into_arc = []
to_arc = []
# allocation
# `no_std` swaps std for alloc throughout, here and in word_bounds. Every method this
# crate has returns something owned, so alloc is what it needs; std is what it happened
# to be written against.
no_std = ["word_bounds/no_std"]
# `no_alloc` adds `write_case`, which writes the converted text into storage the caller
# lends. It does not take the allocating conversions away.
no_alloc = ["no_std", "dep:notko", "word_bounds/no_alloc"]
# misc
benchmark = ["word_bounds/benchmark", "optimize_for_cpu"]
